name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install seleniumbase==4.20.0 requests==2.31.0
          seleniumbase install chromedriver
      - name: 代理设置（可选）
        if: env.IS_PROXY == 'true'
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
            sleep 10
          fi
      - name: 运行续期
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS }}  # 注意 Secret 名称是 ACCOUNTS，但脚本读取 ACCOUNTS_JSON
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: 'true'
          GH_TOKEN: ''   # 禁用更新
          IS_PROXY: ${{ secrets.IS_PROXY }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
        run: |
          if [ -z "$IS_PROXY" ]; then export IS_PROXY=false; fi
          if [ -z "$PROXY_SERVER" ]; then export PROXY_SERVER=socks5://127.0.0.1:1080; fi
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python3 app.py
