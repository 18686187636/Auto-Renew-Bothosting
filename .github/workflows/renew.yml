name: Auto Renew Bot-hosting (Multi-Account via Matrix)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # 允许其他账号继续运行，即使某个失败
      matrix:
        # 从 secrets.ACCOUNTS_JSON 解析账号列表，并构建矩阵
        # 使用 fromJSON 将 JSON 数组转换为 GitHub Actions 矩阵
        account: ${{ fromJSON(secrets.ACCOUNTS_JSON) }}

    permissions:
      actions: write
      contents: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖、Chrome 和 Python 包
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: ⚙️ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "ℹ️ NODE_LINK 未设置，将不使用代理"
            echo "IS_PROXY=false" >> $GITHUB_ENV
            exit 0
          fi
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          sleep 10
          echo "✅ 代理已启动（由 setup_proxy.sh 确认）"
          echo "IS_PROXY=true" >> $GITHUB_ENV

      - name: 🚀 运行续期脚本（单账号）
        env:
          EMAIL: ${{ matrix.account.email }}
          SESSION_TOKEN: ${{ matrix.account.session_token }}
          DISCORD_TOKEN: ${{ matrix.account.discord_token }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: 'true'
          IS_PROXY: ${{ env.IS_PROXY || 'false' }}
          PROXY_SERVER: 'socks5://127.0.0.1:1080'   # 根据代理实际协议调整
        run: |
          echo "代理状态: IS_PROXY=$IS_PROXY"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
