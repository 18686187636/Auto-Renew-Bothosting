name: "Auto Renew Bot-hosting (Matrix)"

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  # ---------- 调试作业：验证 Secret 是否有效 ----------
  debug-secret:
    runs-on: ubuntu-latest
    steps:
      - name: "检查 ACCOUNTS Secret 是否存在"
        run: |
          if [ -z "${{ secrets.ACCOUNTS }}" ]; then
            echo "❌ ACCOUNTS Secret 未设置或为空"
            exit 1
          else
            echo "✅ ACCOUNTS Secret 存在"
          fi

      - name: "验证 JSON 格式并输出账号数量"
        run: |
          # 将 Secret 内容保存到临时文件并尝试解析
          echo '${{ toJson(secrets.ACCOUNTS) }}' > accounts.json
          # 用 jq 解析并统计数组长度
          count=$(jq '. | length' accounts.json 2>/dev/null || echo "invalid")
          if [ "$count" = "invalid" ]; then
            echo "❌ ACCOUNTS 不是有效的 JSON 数组"
            exit 1
          else
            echo "✅ JSON 有效，包含 $count 个账号"
          fi

  # ---------- 续期作业（矩阵） ----------
  renew:
    runs-on: ubuntu-latest
    needs: debug-secret   # 确保调试通过后再运行（可选）
    if: success()         # 仅当前面调试成功才执行
    strategy:
      matrix:
        account: ${{ fromJSON(secrets.ACCOUNTS) }}
      max-parallel: 2
    env:
      EMAIL: ${{ matrix.account.email }}
      SESSION_TOKEN: ${{ matrix.account.session_token }}
      DISCORD_TOKEN: ${{ matrix.account.discord_token }}
      GH_TOKEN: ""
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      HEADLESS: "true"
      IS_PROXY: "true"
      PROXY_SERVER: "socks5://127.0.0.1:1080"
    steps:
      - uses: actions/checkout@v6

      - name: "设置 Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "安装系统依赖、Chrome 和 Python 包"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install seleniumbase==4.20.0 requests==2.31.0
          seleniumbase install chromedriver

      - name: "调试矩阵（打印账号信息）"
        run: |
          echo "当前处理账号: $EMAIL"
          echo "SESSION_TOKEN 前10位: ${SESSION_TOKEN:0:10}..."
          echo "DISCORD_TOKEN 前10位: ${DISCORD_TOKEN:0:10}..."

      - name: "代理设置（可选）"
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "⚠️ NODE_LINK 未设置，将不使用代理"
            export IS_PROXY=false
          else
            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
            sleep 10
          fi

      - name: "运行续期"
        run: |
          echo "代理状态: $IS_PROXY, 代理地址: $PROXY_SERVER"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python3 app.py

      - name: "清理"
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log
