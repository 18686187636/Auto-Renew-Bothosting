name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 1:00 (北京时间 9:00)，可根据需要调整
  workflow_dispatch:       # 允许手动触发

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write       # 用于删除旧的运行记录
      contents: read       # 读取仓库内容

    steps:
      # 1. 检出代码
      - name: 📥 检出代码
        uses: actions/checkout@v6

      # 2. 设置 Python 环境
      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 3. 安装系统依赖、Chrome 浏览器和 Python 依赖
      - name: 🛠️ 安装系统依赖、Chrome 和 Python 包
        run: |
          sudo apt-get update
          # 基础工具和中文字体
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          # 安装 Google Chrome 稳定版
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          # 安装 Python 依赖（锁定版本，避免不兼容）
          pip install seleniumbase==4.20.0 requests==2.31.0
          # 安装 ChromeDriver（由 seleniumbase 管理）
          seleniumbase install chromedriver

      # 4. （可选）设置代理（sing-box）
      - name: ⚙️ 设置代理 (sing-box)
        continue-on-error: true   # 代理失败时不中断工作流（可改为 false 强制中断）
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          # 如果 NODE_LINK 为空，则跳过代理设置
          if [ -z "$NODE_LINK" ]; then
            echo "ℹ️ 未配置 NODE_LINK，跳过代理启动"
            exit 0
          fi
          # 下载并执行代理配置脚本（请确保脚本来源可信）
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          # 等待代理就绪
          sleep 5

      # 5. 运行续期脚本
      - name: 🚀 运行续期脚本
        env:
          # 多账号配置（JSON 数组）
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          # 单账号配置（多账号模式下会被忽略，但保留作为兼容）
          EMAIL: ${{ secrets.EMAIL }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 运行参数
          HEADLESS: 'true'                     # 无头模式
          IS_PROXY: 'true'                     # 启用代理（若代理已启动）
          PROXY_SERVER: 'http://127.0.0.1:1080' # sing‑box 默认端口
        run: |
          # 使用 xvfb 运行（即使 headless=true 也需要 xvfb 来模拟显示）
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python3 app.py

      # 6. 清理残留进程和临时文件
      - name: 🧽 清理进程和临时文件
        if: always()    # 无论成功与否都执行
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      # 7. 清理旧的工作流运行记录（保留最近 1 条）
      - name: 🧹 清理旧运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
