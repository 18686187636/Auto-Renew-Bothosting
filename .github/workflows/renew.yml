name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v6

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖、Chrome 和 Python 包
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install seleniumbase==4.20.0 requests==2.31.0
          seleniumbase install chromedriver

      - name: ⚙️ 设置代理 (sing-box)
        id: proxy_setup
        # 强制代理必须成功，不再 continue-on-error
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "ℹ️ NODE_LINK 未设置，将不使用代理"
            echo "IS_PROXY=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "🔧 正在启动代理..."
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          sleep 10
          # 强制校验代理是否可用
          echo "🔍 校验代理可用性..."
          if curl -x http://127.0.0.1:1080 https://bot-hosting.net -I -s -o /dev/null; then
            echo "✅ 代理可用"
            echo "IS_PROXY=true" >> $GITHUB_ENV
          else
            echo "❌ 代理不可用，工作流终止"
            exit 1
          fi

      - name: 🚀 运行续期脚本
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          EMAIL: ${{ secrets.EMAIL }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: 'true'
          IS_PROXY: ${{ env.IS_PROXY || 'false' }}
          PROXY_SERVER: 'http://127.0.0.1:1080'
        run: |
          echo "代理状态: IS_PROXY=$IS_PROXY"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
